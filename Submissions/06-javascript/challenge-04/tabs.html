<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Component</title>

    <style>
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 50px;
        }

        .tabs{
            width: 400px;
            margin: auto;
        }

        .tab-buttons{
            display: flex;
            border-bottom: 2px solid #ccc;
        }

        .tab-btn{
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border: none;
            background: #f1f1f1;
            font-size: 16px;
        }

        .tab-btn.active{
            background: #007bff;
            color: white;
            font-weight:bold;
        }

        .tab-content {
            padding: 15px;
            border: 1px solid #ccc;
            border-top: none;
        }

        .tab-panel {
            display: none;
        }
        
        .tab-panel.active {
            display: block;
        }
    </style>
</head>
<body>
    
    <div class="tabs">
        <div class="tab-buttons" id="tabButtons" role="tablist"></div>
        <div class="tab-content" id="tabContent"></div>
    </div>

    <script src="tabs.js"></script>
</body>
</html>
