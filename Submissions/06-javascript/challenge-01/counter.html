<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4 text-center" style="width: 320px;">

  
       <h1 id="countDisplay"  class="display-3 mb-4">0</h1>

       <div class="btn-group" role="group" aria-label="Basic example">

       <button id="decrement" class="btn btn-danger btn-lg">-</button>
       <button id="reset" class="btn btn-secondary btn-lg">reset</button>
       <button id="increment" class="btn btn-success btn-lg">+</button>

</div>

        <br><br>

       <div>
       <p class="fw-bold mb-2">Step</p>
       <div class="d-flex justify-content-between mb-3">
      
        <button class="btn btn-outline-primary step" data-step="1">1</button>
        <button class="btn btn-outline-primary step" data-step="5">5</button>
        <button class="btn btn-outline-primary step" data-step="10">10</button>
       <br><br>
    </div>
</div>
</div>


       <script src="counter.js"></script>

</body>
</html>
