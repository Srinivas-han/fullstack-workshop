<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Basic Quiz</title>
</head>
<body>
    
    <script>
        let score=0;

        let Q1=prompt(" 1. What is 5 + 3? \n A. 9 \n B. 8 \n C. 10 ");
        if(Q1.toUpperCase()==="B"){
            score++;
        }

        let Q2=prompt("  2. What is the capital of France? \n A. Paris \n B. England \n C. New York ");
        if(Q2.toUpperCase()==="A"){
            score++;
        }
        
        let Q3=prompt("3. What color is the sky? \n A. Green \n B. Red \n C. Blue");
        if(Q3.toUpperCase()==="C"){
            score++;
        }
        
        alert("Quiz Completed! /n Your Final Score is"+score+"/3");
        console.log("Final Score",score);
         
    </script>
</body>
</html>
