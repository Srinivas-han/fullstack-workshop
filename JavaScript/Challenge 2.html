<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>
<body>
    <script>
          let choice = prompt(
        "Choose conversion type:\n" +
        "1. Celsius to Fahrenheit\n" +
        "2. Fahrenheit to Celsius"
    );

    let temperature=parseFloat(prompt("Enter the Temperature value:"));
    let result;
    if(choice==="1"){

        result=(temperature*9/5)+32;
        alert(temperature + "°C = " + result.toFixed(2) + "°F");
        
    }else if(choice==="2"){
            result=(temperature-32)*5/9;
            alert(temperature + "°f= "+ result.toFixed(2) + "°C" );
    }else{
         alert("Invalid choice! Please select 1 or 2.");
    }
    console.log("converted Temperature:",result);

    </script>
    
</body>
</html>
